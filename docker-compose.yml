services:
  secrets-init:
    image: alpine:3.21
    restart: "no"
    environment:
      # After initial setup, set REQUIRE_EXISTING_DATA=true in Coolify.
      # Refuse to start with an empty database or regenerated encryption keys.
      REQUIRE_EXISTING_DATA: ${REQUIRE_EXISTING_DATA:-false}
    volumes:
      # Keep the ORIGINAL volume names; changing them makes existing data invisible.
      - t2vpn_secrets:/secrets
      - t2vpn_pgdata:/pgdata:ro
      - t2vpn_backups:/backups:ro
    command: >
      sh -ec '
      if [ "$REQUIRE_EXISTING_DATA" = "true" ] &&
         { [ ! -s /pgdata/PG_VERSION ] ||
           [ ! -s /secrets/db_password ] ||
           [ ! -s /secrets/profile_key ]; }; then
        echo "STORAGE GUARD: Existing PostgreSQL data and original secrets are required. Stop: refusing an empty/replaced volume." >&2;
        exit 1;
      fi;
      if [ -f /backups/.database_initialized ] &&
         { [ ! -s /pgdata/PG_VERSION ] ||
           [ ! -s /secrets/db_password ] ||
           [ ! -s /secrets/profile_key ]; }; then
        echo "STORAGE GUARD: A previously initialized database or original secrets are missing. Stop: restore original volumes." >&2;
        exit 1;
      fi;
      if [ -s /pgdata/PG_VERSION ] &&
         { [ ! -s /secrets/db_password ] ||
           [ ! -s /secrets/profile_key ]; }; then
        echo "STORAGE GUARD: PostgreSQL already contains data but its original credentials/encryption key are missing. Refusing regeneration." >&2;
        exit 1;
      fi;
      if [ ! -s /secrets/db_password ]; then
        umask 077; head -c 48 /dev/urandom | od -An -tx1 | tr -d " \n" > /secrets/db_password;
      fi;
      if [ ! -s /secrets/profile_key ]; then
        umask 077; head -c 32 /dev/urandom | od -An -tx1 | tr -d " \n" > /secrets/profile_key;
      fi;
      chmod 644 /secrets/db_password /secrets/profile_key
      '
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: t2vpn
      POSTGRES_DB: t2vpn
      POSTGRES_PASSWORD_FILE: /run/t2vpn/db_password
    volumes:
      - t2vpn_pgdata:/var/lib/postgresql/data
      - t2vpn_secrets:/run/t2vpn:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U t2vpn -d t2vpn"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - private
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in Coolify}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in Coolify (12+ characters)}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET (32+ characters)}
      ADMIN_PUBLIC_ORIGIN: ${ADMIN_PUBLIC_ORIGIN:-https://vpn2.t2dev.in}
      TELEMETRY_INGEST_SECRET: ${TELEMETRY_INGEST_SECRET:-}
      MOBILE_PROVISIONING_ENABLED: ${MOBILE_PROVISIONING_ENABLED:-false}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64:-}
      PLAY_PLUS_PRODUCT_IDS: ${PLAY_PLUS_PRODUCT_IDS:-}
      NODE_ENV: production
    volumes:
      - t2vpn_secrets:/run/t2vpn:ro
      - t2vpn_backups:/backups
    expose:
      - "3000"
    networks:
      - private
      - default
volumes:
  t2vpn_pgdata:
  t2vpn_secrets:
  t2vpn_backups:
networks:
  private:
    internal: true

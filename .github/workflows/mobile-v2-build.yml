name: T2VPN V2 mobile API build
on:
  push:
    branches:
      - main
      - 'feature/v2-android-backend-*'
      - 'fix/coolify-safe-prisma-unique-index-*'
      - 'fix/ad-management-save-simplify-*'
      - 'feature/yandex-five-mobile-formats-*'
      - 'fix/v2-persistent-redeploy-guards-*'
      - 'feature/dashboard-country-today-live-*'
      - 'fix/rewarded-unlock-setup-ui-*'
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: build
          POSTGRES_PASSWORD: build
          POSTGRES_DB: build
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U build -d build"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build?schema=public
      AUTH_SECRET: test-only-placeholder-do-not-use-in-production-abcdefghijk
      ADMIN_USERNAME: ci
      ADMIN_PASSWORD: placeholder-only-for-ci
      ADMIN_PUBLIC_ORIGIN: https://vpn2.t2dev.in
      VPN_PROFILE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MOBILE_PROVISIONING_ENABLED: 'false'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Test Free/Plus routing
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npm run build
      - name: Safely upgrade database containing an existing installation
        run: |
          node scripts/ci-existing-installation.mjs seed
          npm run db:prepare
          npm run db:prepare
          npx prisma db push
          node scripts/ci-existing-installation.mjs verify
          npm run db:seed
      - name: Smoke-test authenticated V2 APIs on a temporary PostgreSQL database
        run: |
          npm run start > /tmp/next-v2.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health >/dev/null && break; sleep 2; done
          node scripts/mobile-api-smoke.mjs
      - name: Smoke-test authorized VPN profile delivery (isolated CI credentials)
        run: |
          MOBILE_PROVISIONING_ENABLED=true npx next start -H 0.0.0.0 -p 3001 > /tmp/next-v2-provision.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3001/api/health >/dev/null && break; sleep 2; done
          SMOKE_BASE_URL=http://localhost:3001 node scripts/mobile-provisioning-smoke.mjs
      - name: Validate volumes and safe startup order
        run: |
          docker compose config --quiet
          node scripts/verify-storage-config.mjs
          sh -n scripts/backup-before-migration.sh
          sh -n scripts/docker-start.sh
      - name: Build Coolify Docker image
        run: docker build -t t2vpn-admin-v2 .
      - name: Verify backup client and a real PostgreSQL snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/t2vpn-backups"
          printf 'build' > "$RUNNER_TEMP/ci-pg-password"
          chmod 600 "$RUNNER_TEMP/ci-pg-password"
          docker run --rm --network host --entrypoint sh \
            -v "$RUNNER_TEMP/t2vpn-backups:/backups" \
            -v "$RUNNER_TEMP/ci-pg-password:/ci-pg-password:ro" \
            -e BACKUP_DB_PASSWORD_FILE=/ci-pg-password \
            -e BACKUP_DB_HOST=127.0.0.1 \
            -e BACKUP_DB_USER=build \
            -e BACKUP_DB_NAME=build \
            t2vpn-admin-v2 scripts/backup-before-migration.sh
          test -f "$RUNNER_TEMP/t2vpn-backups/.database_initialized"
          test "$(find "$RUNNER_TEMP/t2vpn-backups" -maxdepth 1 -name 'predeploy-*.dump' | wc -l)" -eq 1
          docker run --rm --entrypoint sh \
            -v "$RUNNER_TEMP/t2vpn-backups:/backups:ro" \
            t2vpn-admin-v2 -ec 'pg_restore --list /backups/predeploy-*.dump > /dev/null'


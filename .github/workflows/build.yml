name: V2 build and type validation
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://t2vpn:build-only@localhost:5432/t2vpn?schema=public
      AUTH_SECRET: build-only-secret-not-for-production-aaaaaaaaaaaaaaaaaaaa
      ADMIN_USERNAME: build-check
      ADMIN_PASSWORD: build-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npm run build
